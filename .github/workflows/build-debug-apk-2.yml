name: Build Debug APK (R8 + shrinking)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor to build
        type: choice
        options: [github, foss]
        default: github

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLAVOR: ${{ inputs.flavor || 'github' }}

jobs:
  build:
    name: Assemble minified debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Enables R8 shrinking/obfuscation/optimization and resource shrinking
      # on the debug build type, and restricts the build to arm64-v8a,
      # without touching build.gradle.
      - name: Create R8 init script
        run: |
          cat > "$RUNNER_TEMP/r8-debug.init.gradle" <<'EOF'
          allprojects { p ->
            p.plugins.withId('com.android.application') {
              // finalizeDsl runs after build.gradle, before AGP locks the DSL
              p.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.buildTypes.getByName('debug') {
                  minifyEnabled = true
                  shrinkResources = true
                  def rules = ['proguard-rules.pro', 'proguard-rules.txt']
                    .collect { p.file(it) }
                    .findAll { it.exists() }
                  proguardFiles(
                    android.getDefaultProguardFile('proguard-android-optimize.txt'),
                    *rules
                  )
                }

                // arm64-v8a only: handle both ABI-split and abiFilters setups
                def abi = android.splits.abi
                // AGP rejects ndk.abiFilters and splits.abi together, so
                // abiFilters must be emptied whenever splits are enabled.
                android.defaultConfig.ndk.abiFilters.clear()
                if (abi.enable) {
                  abi.reset()
                  abi.include 'arm64-v8a'
                  abi.universalApk = false
                } else {
                  android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
                }
              }
            }
          }
          EOF

      # Builds ONE flavor (assembleDebug would build every flavor and
      # double the R8 work). Heap is set explicitly: R8 on a large app with
      # the default heap thrashes in GC and looks like a hang.
      - name: Build debug APK
        run: |
          TASK="assemble${FLAVOR^}Debug"
          echo "Running :app:$TASK"
          ./gradlew ":app:$TASK" \
            --init-script "$RUNNER_TEMP/r8-debug.init.gradle" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            --build-cache --console=plain --stacktrace --no-daemon

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p dist
          find . -path "*/build/outputs/apk/*" -name "*.apk" -not -path "./dist/*" | while read -r f; do
            cp "$f" "dist/$(basename "${f%.apk}")-r8-${GITHUB_SHA::7}.apk"
          done
          ls -lh dist
          [ -n "$(ls -A dist)" ] || { echo "No APK found" >&2; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.FLAVOR }}-debug-r8-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      # Needed to de-obfuscate stack traces from this build
      - name: Upload R8 mapping files
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ env.FLAVOR }}-${{ github.sha }}
          path: |
            **/build/outputs/mapping/**/mapping.txt
            **/build/outputs/mapping/**/usage.txt
            **/build/outputs/mapping/**/seeds.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "**/build/reports/"
          retention-days: 7
